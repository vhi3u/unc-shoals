# ═══════════════════════════════════════════════════════════════════════════
# Parameter Sweep Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Each [[runs]] entry defines one simulation.
# The PBS job array index (1-based) maps to the order of entries here.
#
# Parameters:
#   Zs            - Absolute depth of the peak of the shoal [m] (default: -5.0)
#   shoal_length  - Horizontal extent of the shoal ridge [m]
#   sigma         - Along-shore Gaussian width [m] (default: 8000.0)
#   Zsh           - Background shelf depth [m] (default: -25.0)
#   strat         - Stratification scenario ("default", "winter", "summer")
#   wind_stress   - Surface wind stress [N/m^2] (default: 0.0)
#   run_label     - A short label for output directory naming
# ═══════════════════════════════════════════════════════════════════════════

# ── Shoal Geometry Sweep (Ls = 20-40 km, Zs = -15 to -5 m) ─────────────────

[[runs]]
run_label     = "Zs15_Ls40k"
Zs            = -15.0
shoal_length  = 40000.0

[[runs]]
run_label     = "Zs10_Ls40k"
Zs            = -10.0
shoal_length  = 40000.0

[[runs]]
run_label     = "Zs5_Ls40k"
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "Zs5_Ls20k"
Zs            = -5.0
shoal_length  = 20000.0

[[runs]]
run_label     = "Zs5_Ls30k"
Zs            = -5.0
shoal_length  = 30000.0

# ── Shelf Depth Sweep ──────────────────────────────────────────────────
[[runs]]
run_label     = "Zsh_m10"
Zs            = -5.0
shoal_length  = 40000.0
Zsh           = -10.0

[[runs]]
run_label     = "Zsh_m50"
Zs            = -5.0
shoal_length  = 40000.0
Zsh           = -50.0

# ── Wind Forcing Sweep ─────────────────────────────────────────────────

[[runs]]
run_label     = "wind_m0p05"
wind_stress   = -0.05
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "wind_m0p03"
wind_stress   = -0.03
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "wind_m0p01"
wind_stress   = -0.01
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "wind_0p01"
wind_stress   = 0.01
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "wind_0p03"
wind_stress   = 0.03
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "wind_0p05"
wind_stress   = 0.05
Zs            = -5.0
shoal_length  = 40000.0

# ── Velocity Sweep ─────────────────────────────────────────────────────

[[runs]]
run_label     = "v0_0p10"
v0            = 0.10
Zs            = -5.0
shoal_length  = 40000.0

[[runs]]
run_label     = "v0_0p15"
v0            = 0.15
Zs            = -5.0
shoal_length  = 40000.0
