# ═══════════════════════════════════════════════════════════════════════════
# DIAMOND SHOALS WITH A CAPE: a resolution ladder, 500 -> 100 m
# ═══════════════════════════════════════════════════════════════════════════
#
# WHY. In params_diamond.toml (500 m) the cape's wake stayed nearly laminar at
# v0 = 0.20 and the shoal changed the offshore transport and EKE little. Two
# reasons to suspect the grid:
#   - the shelf's baroclinic deformation radius is NH/f ~ 0.013 x 25 / 8.4e-5
#     ~ 4 km, and WENO's effective resolution is ~6-8 dx: 3-4 km at 500 m, so
#     eddies at the deformation radius are barely representable;
#   - the separated shear layer off the cape is ~3 grid cells thick, ~1.5 km
#     at 500 m; its instability grows like dU / thickness, so a numerically
#     thick layer rolls up too slowly to make eddies before it is swept away.
# The width/OBC sweep already showed EKE at Zs = -5 m was NOT converged at
# 500 m (x3.46 from 500 to 250 m). This ladder finds where it converges.
#
# DOMAIN. 80 x 160 km (was 150 x 200): the cape at y0 = 60 km (its 50 km base
# spans y = 35-85 km), so 15 km of straight coast past the 20 km inflow strip,
# and ~80 km of wake before the 20 km outflow strip; the shelf break at
# x = 47 km leaves 33 km of deep water before the open east boundary.
# Geometry as DS_cape in params_diamond.toml. 60 days: the wake is flushed in
# ~160 km / 0.1 m/s ~ 18 days, so the last 30 days are a statistically steady
# window.
#
# THE RUNS
#   1  DSR_cape_v020_500     500 m   } the ladder at v0 = 0.20
#   2  DSR_cape_v020_250     250 m   }
#   3  DSR_cape_v020_125     125 m   }
#   4  DSR_cape_v0065_125    125 m, v0 = 0.065 (vs DS_cape_v0065 at 500 m)
#   5  DSR_cape_v020_100     100 m   (separate job: A100, see below)
#
# COST, scaled from a 250 m / 150 x 200 km / 120-day run (3.2 h on a V100):
# cost ~ area x days / dx^3. Here 0.43 x the area, half the days:
#   500 m ~ 5 min, 250 m ~ 0.7 h, 125 m ~ 5.5 h, 100 m ~ 11 h (V100).
# Cells: 125 m is 640 x 1280 x 50 = 41 M; 100 m is 800 x 1600 x 50 = 64 M,
# which is why run 5 asks for an A100.
#
# Submit:  qsub src/sweep/submit_diamond_res.pbs.template       (runs 1-4)
#          qsub src/sweep/submit_diamond_res100.pbs.template    (run 5)
# ═══════════════════════════════════════════════════════════════════════════

[[runs]]
