crest_length = 17000.0
taper_length = 3000.0
sigma        = 4600.0
Zsh          = -24.0
shoreface_width = 10000.0
break_distance  = 22000.0
rise_width   = 2000.0
Lx           = 80000.0
Ly           = 160000.0
shoal_y0     = 60000.0
open_y       = true
sim_days     = 60.0
v0           = 0.2
dx           = 500.0

