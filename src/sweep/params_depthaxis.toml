# ═══════════════════════════════════════════════════════════════════════════
# THE DEPTH AXIS: crest depth Z_s, crest length held fixed, no trench
# ═══════════════════════════════════════════════════════════════════════════
#
# Varies the shoal's crest depth Z_s = -5 / -10 / -15 m with everything else
# held fixed, at dx = 250 m for 120 days.
#
# ── what changed (2026-11-25) ──────────────────────────────────────────────
# The first version (cluster_depthaxis_120) put the shoal ON the shelf with
# shoal_start = 20 km so the crest length and inshore flank stayed fixed. That
# left a trench between the coast and the shoal: the background drops to the
# 25 m shelf by 12 km and the shoal ramp climbs back up, a channel 18.6 / 14.7
# / 9.9 m deep at x ~ 12 km. dshoal_param_bottom now refuses any trench.
#
# This version keeps the shoal ATTACHED to the coast (shoal_start = 0, no
# trench possible) and holds the CREST LENGTH fixed another way. The flat
# crest of an attached shoal starts where the coastal slope reaches Z_s and
# runs to shoal_length, so shoal_length is set per run to start + 37 km:
#
#   Z_s    crest starts    shoal_length    crest          inshore of the crest
#   -5      0.00 km          37.0 km       0 - 37 km      none (crest at the coast)
#   -10     6.50 km          43.5 km       6.5 - 43.5 km  coastal slope -5 -> -10 m
#   -15     8.23 km          45.2 km       8.2 - 45.2 km  coastal slope -5 -> -15 m
#
# (crest starts computed with tools/shoal_bathymetry.m on this background.)
# The inshore side is the background coastal slope itself, so it is the SAME
# slope in every run, just cut off at a different depth. Each 15 km offshore
# taper ends by 60 km, inshore of the shelf break (rise_mid = 76 km).
#
# Check the geometry: tools/show_bathymetry.m.
#
# Cost: 3 runs x ~3.2 h = ~10 GPU-h at 250 m.
# Submit:  qsub src/sweep/submit_depthaxis.pbs.template
# ═══════════════════════════════════════════════════════════════════════════

[[runs]]
run_label         = "Zs05_att"
Zs                = -5.0
shoal_length      = 37000.0
shelf_break_end   = 12000.0
rise_mid          = 76000.0
dx                = 250.0
sim_days          = 120.0

