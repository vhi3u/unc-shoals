# ═══════════════════════════════════════════════════════════════════════════
# GEOMETRY CONTROLS — is the Fig. 4b EKE trend shoal height, or the two things
# that covary with it?
# ═══════════════════════════════════════════════════════════════════════════
#
# Zs sets the crest depth, but the shoal is built by filling the background up
# to that level, so a deeper crest ALSO gets:
#
#   1. a shorter flat crest -- the fill starts further offshore
#   2. a steeper inshore flank -- it is the background shelf break, truncated
#      at Zs, and the tanh is steeper the deeper you cut it
#
#   label            Zs     Ls    sbe   rise | crest   inshore   shelf
#   Zs05_ref       -5.0   40.0   12.0   63.5 | 40.4 km  0.0      32.0 km
#   Zs15_ref      -15.0   40.0   12.0   63.5 | 32.4 km  0.00349  32.0 km
#
# So the two points Fig. 4b compares differ in three ways, not one. These five
# runs separate them. Each control changes ONE of the three and holds the other
# two, with the geometry solved numerically rather than guessed:
#
#   Zs15_Lsfix    -15.0   48.3   12.0   63.5 | 40.6 km  0.00349  32.0 km
#       crest restored to 40 km at the deep crest. vs Zs15_ref, isolates CREST
#       LENGTH. Same depth, same flank.
#
#   Zs05_Lsmatch   -5.0   32.4   12.0   63.5 | 32.9 km  0.0      32.0 km
#       the same test from the other side -- shorten the SHALLOW shoal instead
#       of lengthening the deep one. If both agree, the result is not an
#       artifact of which run was altered.
#
#   Zs15_slopefix -15.0   51.8   20.0   76.0 | 40.5 km  0.00165  32.0 km
#       crest held at 40 km AND the inshore flank halved, 0.00349 -> 0.00165.
#       vs Zs15_Lsfix, isolates FLANK SLOPE. Needs rise_mid because widening
#       the break to soften it eats into the shelf; moving the offshore ramp
#       to 76 km puts the shelf back at 32.0 km.
#
# How to read the result:
#   Zs15_Lsfix  ~= Zs15_ref   -> crest length is not driving Fig. 4b
#   Zs15_slopefix ~= Zs15_Lsfix -> flank slope is not either, and the trend is
#                                  shoal height after all
#   either differs materially -> Fig. 4b's x-axis is doing more than one job
#                                and needs re-cutting
#
# 500 m and 120 days. This was 50 days, to match the production HsLs runs --
# but at 50 days the Z_S = -15 m runs have not equilibrated. EKE per 10-day
# window, from the first run of this sweep (x1e-5):
#
#   Zs05_ref        2.27  2.21  2.12  2.00    settled by day 20
#   Zs05_Lsmatch    1.24  1.15  1.35  1.09    settled, oscillating +/-20%
#   Zs15_ref        2.12  1.07  0.59  0.58    halved twice, only just flat
#   Zs15_Lsfix      2.59  1.45  0.65  0.89    near equilibrium, +/-40%
#   Zs15_slopefix   2.25  1.62  0.71  0.41    STILL FALLING at day 50
#
# The shallow cases settle in ~20 days and the deep ones do not settle within
# the run, so every contrast that crosses Z_S compares a converged state with
# one still spinning down. Only the Fig. 4b pair itself (-71%) is large enough
# to survive that; the flank-slope contrast is the worst affected, and because
# Zs15_slopefix is still DECLINING its equilibrium ratio is lower than the
# -54% measured, so that number is a floor rather than an estimate.
#
# 120 days, matching params_weakwind.toml, so every sweep in this project
# shares one integration length and no figure mixes run lengths. 100 was the
# first choice, but Zs15_slopefix was still falling at day 50 with no sign of
# a plateau, so there was no basis for expecting 100 to be enough either.
#
# Cost: 50 days ran in 17-19 min wall (34 ms/timestep, ~4.2 GB, one V100),
# so 120 days is about 45 min. An earlier note here said "2.4x of 04:00:00"
# -- that read the PBS ALLOCATION as if it were the runtime. Compute is not
# the constraint on this sweep; 240 days would still be ~90 min.
#
# Submit:  qsub src/sweep/submit_geomcontrol.pbs
#
# EKE stays comparable with Fig. 4b because the diagnostic is unchanged; the
# HsLs runs are themselves 50 days, so if the deep cases there are also still
# adjusting, that is a question this sweep raises about Fig. 4b directly.
#
# Submit:  qsub src/sweep/submit_geomcontrol.pbs     (array 1-5)
# ═══════════════════════════════════════════════════════════════════════════

