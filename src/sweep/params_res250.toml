# ═══════════════════════════════════════════════════════════════════════════
# RESOLUTION CHECK — does the Fig 4b EKE-vs-shoal-height trend survive Δx/2?
# ═══════════════════════════════════════════════════════════════════════════
#
# Why: at Δx = 500 m the deformation radius over the shoal is badly under-
# resolved, and it gets worse as the shoal gets shallower — which is exactly
# the axis Fig 4b varies:
#
#     Zs = -15 m   Ld = 0.77 km   Ld/Δx = 1.5
#     Zs = -10 m   Ld = 0.41 km   Ld/Δx = 0.8
#     Zs =  -5 m   Ld = 0.05 km   Ld/Δx = 0.1
#
# So the EKE trend across that sweep may be a resolution trend. This table runs
# the same three cases at BOTH resolutions, for the SAME duration, so only Δx
# differs. If the EKE ratio between Zs = -5 and Zs = -15 is the same at both,
# the trend is physical; if it is not, Fig 4b needs re-running at 250 m.
#
# NOTE Δx = 250 m does NOT resolve Zs = -5 (Ld/Δx only reaches 0.2). It cannot:
# a 5 m column of surface mixed layer has almost no baroclinic Ld. The test is
# about the SENSITIVITY of the trend to resolution, not about resolving it.
#
# RUN LENGTH. This was 20 days, which cannot answer the question the table is
# asking. At 20 days the Z_S = -15 m cases are mid-collapse -- EKE halves
# every 10-day window and does not settle inside 50 days, let alone 20 (see
# params_geomcontrol.toml and params_weakwind.toml for the per-window
# evidence). Comparing 500 m and 250 m at day 20 compares two transients, and
# a difference between them says as much about their adjustment rates as
# about resolution. Now 120 days, matching the other sweeps.
#
# COST. The 500 m side of this table is now measured at both run lengths
# (res250_1.log):
#
#   50 days   18.6 min wall   16152 steps @ 34.4 ms   =  9.3 min stepping
#   120 days  31.0 min wall   39250 steps @ 35.1 ms   = 23.0 min stepping
#
# so T_wall(500 m) ~ 8.5 min + 0.19 min/day: ~8-9 min of Julia compilation
# and setup that does not scale, plus stepping that does. 6.0M cells at
# 35 ms/step is 5.8 ns per cell-step on a V100.
#
# And 250 m, measured (res250_6.log, R250_Zs15, 120 days):
#
#   3.139 h wall   77994 steps @ 136.8 ms   = 2.96 h stepping, 10.5 min fixed
#   -> T_wall(250 m) ~ 10 min + 1.48 min/day
#
# Against the 500 m run of the same length:
#
#   cells        4x    (600x800x50 vs 300x400x50; Nz is unchanged)
#   ms/step   3.90x    slightly sublinear -- the GPU is better fed at 250 m
#   timesteps 1.99x    Δt HALVED: 245-280 s -> 133-137 s
#   wall      6.08x    0.52 h -> 3.14 h
#
# THE TIMESTEP FACTOR WAS PREDICTED WRONG HERE, and the reason is worth
# keeping. The argument was: the vertical term is ~75% of the CFL budget and
# Δz = 1 m is unchanged at 250 m, so only the horizontal quarter tightens and
# Δt falls ~20%. That treats w as a property of the flow, independent of the
# grid. It is not. max|w| went 2.86e-3 -> 5.52e-3 m/s, almost exactly 2x: the
# finer grid resolves stronger vertical velocities, so wΔt/Δz tightened by
# the same factor as the horizontal term and Δt halved after all. The
# vertical share of the budget is unchanged at 75% precisely BECAUSE both
# terms scaled together.
#
# So the "~8x overall" this file once dismissed was right (7.75x on stepping,
# 6.1x on wall once the fixed compile is counted), and the 1.25x correction
# that replaced it was the error. The only estimate that survived is the
# hedge: "unless w grows enough at 250 m to tighten the vertical CFL, which
# would push it to ~3 h."
#
# The earlier "~19 h for 20 days on an A100" warning here was wrong by well
# over an order of magnitude -- it predates any measured runtime.
#
# WALLTIME: 3.14 h under a 04:00:00 cap is 25 min of margin, and Δt depends
# on the run, so any 250 m sweep wants 06:00:00. All six runs did complete
# inside 4 h, but that is not a safe margin to plan the next sweep on.
#
# That change does NOT travel with this file: submit_*.pbs is gitignored on
# purpose (see .gitignore -- the live scripts carry local edits that a pull
# would clobber), so the cap has to be raised on the machine you submit
# from, or overridden per submission, which takes precedence over the
# directive in the script:
#
#   qsub -l walltime=06:00:00 src/sweep/submit_res250.pbs
#
# MEMORY: peak_memusage reports 4108 MiB at 500 m and 5474 MiB at 250 m --
# 1.33x for 4x the cells, which cannot be the field storage. That tool
# measures HOST RSS; the fields live on the GPU and are not in these numbers.
# The "~11 GB, well inside a 32 GB V100" claim below is a calculation, not a
# measurement, and nothing here confirms it. Use CUDA.memory_status() or
# nvidia-smi if the GPU-side figure ever matters.
#
# Memory: ~50 full 3D Float64 fields at 228 MB each (608x808x58 with halos) is
# ~11 GB, well inside a 32 GB V100.
#
# This sweep is now the gate on converting the whole project to 250 m. It
# answers three things at once: whether R250_Zs15 is stable with the
# min_change = 0.2 fix, what 250 m actually costs (measured, not derived),
# and whether the EKE trend survives Δx/2 when both resolutions are compared
# at equilibrium instead of mid-transient.
#
# Submit:  qsub src/sweep/submit_res250.pbs      (array 1-6)
#
# ---------------------------------------------------------------------------
# CONFOUND, found 2026-11-12 while chasing the R250_Zs15 blow-up. This is not
# a clean shoal-height axis. min_depth defaults to max(Zc, Zs) and Zc = -5, so
# at Zs = -5 the clamp flattens the coastal ramp AND the shelf break into the
# shoal plateau. Bottom depth on the shoal centreline:
#
#     x [km]    Zs=-5    Zs=-10   Zs=-15
#        2.0     -5.00    -5.78    -5.78
#        5.0     -5.00    -7.96    -7.96
#        7.8     -5.00   -10.00   -13.54
#       10.0     -5.00   -10.00   -15.00
#       40.0     -5.00   -10.00   -15.00
#
#   max|dh/dx| inside 0-20 km:  Zs=-5: 0.0     (none -- flat slab to 40 km)
#                               Zs=-10: 0.00177 at x = 6.1 km
#                               Zs=-15: 0.00346 at x = 7.9 km
#
# So Zs = -5 has NO shelf break at all -- a uniform 5 m slab out to 40 km --
# while Zs = -15 has the steepest gradient anywhere in the domain, steeper
# than the 63.5 km offshore ramp (0.0025). Varying Zs varies the inner-shelf
# slope at the same time, monotonically. Any EKE difference across this axis
# is a shoal-height AND shelf-break-slope difference, which matters for Fig 4b
# independently of resolution. To separate them, pass min_depth explicitly.
# ---------------------------------------------------------------------------
# ═══════════════════════════════════════════════════════════════════════════

# ── 500 m baseline (re-run at the shortened duration for a fair comparison) ──
[[runs]]
run_label    = "R500_Zs05"
Zs           = -5.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 120.0

[[runs]]
run_label    = "R500_Zs10"
Zs           = -10.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 120.0

[[runs]]
run_label    = "R500_Zs15"
Zs           = -15.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 120.0

# ── 250 m ────────────────────────────────────────────────────────────────────
[[runs]]
run_label    = "R250_Zs05"
Zs           = -5.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 120.0

[[runs]]
run_label    = "R250_Zs10"
Zs           = -10.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 120.0

[[runs]]
run_label    = "R250_Zs15"
Zs           = -15.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 120.0
