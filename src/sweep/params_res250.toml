# ═══════════════════════════════════════════════════════════════════════════
# RESOLUTION CHECK — does the Fig 4b EKE-vs-shoal-height trend survive Δx/2?
# ═══════════════════════════════════════════════════════════════════════════
#
# Why: at Δx = 500 m the deformation radius over the shoal is badly under-
# resolved, and it gets worse as the shoal gets shallower — which is exactly
# the axis Fig 4b varies:
#
#     Zs = -15 m   Ld = 0.77 km   Ld/Δx = 1.5
#     Zs = -10 m   Ld = 0.41 km   Ld/Δx = 0.8
#     Zs =  -5 m   Ld = 0.05 km   Ld/Δx = 0.1
#
# So the EKE trend across that sweep may be a resolution trend. This table runs
# the same three cases at BOTH resolutions, for the SAME duration, so only Δx
# differs. If the EKE ratio between Zs = -5 and Zs = -15 is the same at both,
# the trend is physical; if it is not, Fig 4b needs re-running at 250 m.
#
# NOTE Δx = 250 m does NOT resolve Zs = -5 (Ld/Δx only reaches 0.2). It cannot:
# a 5 m column of surface mixed layer has almost no baroclinic Ld. The test is
# about the SENSITIVITY of the trend to resolution, not about resolving it.
#
# Cost: 250 m costs ~4x the 500 m case in cells, and Δt is now capped at
# max_Δt = 10 min * (Δh/500) = 5 min here, so ~8x overall.
#
# WALLTIME WARNING. This table's own earlier estimate was ~19 h for 20 days at
# 250 m on an A100. The submit script now asks for 4 h on a V100, which has
# roughly half the memory bandwidth of an A100 -- and these kernels are
# bandwidth-bound, so the same work takes LONGER, not shorter. 4 h will very
# likely cut these runs off part-way. The 500 m tables are the ones that fit
# comfortably; raise it per-submit without editing the file:
#
#   qsub -l walltime=24:00:00 src/sweep/submit_res250.pbs
#
# Memory is not the problem: ~50 full 3D Float64 fields at 228 MB each
# (608x808x58 with halos) is ~11 GB, well inside a 32 GB V100.
#
# Submit:  qsub src/sweep/submit_res250.pbs      (array 1-6)
#
# ---------------------------------------------------------------------------
# CONFOUND, found 2026-11-12 while chasing the R250_Zs15 blow-up. This is not
# a clean shoal-height axis. min_depth defaults to max(Zc, Zs) and Zc = -5, so
# at Zs = -5 the clamp flattens the coastal ramp AND the shelf break into the
# shoal plateau. Bottom depth on the shoal centreline:
#
#     x [km]    Zs=-5    Zs=-10   Zs=-15
#        2.0     -5.00    -5.78    -5.78
#        5.0     -5.00    -7.96    -7.96
#        7.8     -5.00   -10.00   -13.54
#       10.0     -5.00   -10.00   -15.00
#       40.0     -5.00   -10.00   -15.00
#
#   max|dh/dx| inside 0-20 km:  Zs=-5: 0.0     (none -- flat slab to 40 km)
#                               Zs=-10: 0.00177 at x = 6.1 km
#                               Zs=-15: 0.00346 at x = 7.9 km
#
# So Zs = -5 has NO shelf break at all -- a uniform 5 m slab out to 40 km --
# while Zs = -15 has the steepest gradient anywhere in the domain, steeper
# than the 63.5 km offshore ramp (0.0025). Varying Zs varies the inner-shelf
# slope at the same time, monotonically. Any EKE difference across this axis
# is a shoal-height AND shelf-break-slope difference, which matters for Fig 4b
# independently of resolution. To separate them, pass min_depth explicitly.
# ---------------------------------------------------------------------------
# ═══════════════════════════════════════════════════════════════════════════

# ── 500 m baseline (re-run at the shortened duration for a fair comparison) ──
[[runs]]
run_label    = "R500_Zs05"
Zs           = -5.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 20.0

[[runs]]
run_label    = "R500_Zs10"
Zs           = -10.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 20.0

[[runs]]
run_label    = "R500_Zs15"
Zs           = -15.0
shoal_length = 40000.0
dx           = 500.0
sim_days     = 20.0

# ── 250 m ────────────────────────────────────────────────────────────────────
[[runs]]
run_label    = "R250_Zs05"
Zs           = -5.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 20.0

[[runs]]
run_label    = "R250_Zs10"
Zs           = -10.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 20.0

[[runs]]
run_label    = "R250_Zs15"
Zs           = -15.0
shoal_length = 40000.0
dx           = 250.0
sim_days     = 20.0
