# ═══════════════════════════════════════════════════════════════════════════
# ZHAO END-MEMBER — our model and forcing, their bathymetry
# ═══════════════════════════════════════════════════════════════════════════
#
# One run. The point is to put OUR model in a Cape Farewell-like geometry and
# see what it produces, so that any disagreement with Zhao et al. is isolated
# to the bathymetry rather than confounded with it. This is the "run matching
# the bathymetry of my preprint works as a separate end-member" suggestion.
#
# ── what is matched ────────────────────────────────────────────────────────
# Zhao et al. Figs. 6d-f and 9a-d: the bottom slopes from the coast to about
# 200 m by x ~ 50 km, then flat deep ocean, uniform in y, 200 m domain.
# Here that is shelf_break_end = 50 km with Zsh = -180 m (so the -7 to -180
# drop spans 5-50 km, mean slope ~0.0035, max ~0.0054) and h_deep = -200.
#
# NO SHOAL. Zs is set equal to Zsh, which makes potential_height =
# max(0, Zs - hw) identically zero everywhere, so the shoal vanishes and the
# bathymetry is the pure shelf-slope background. shoal_length is set small as
# well, to make that intent explicit rather than incidental.
#
# ── what is NOT matched, deliberately ──────────────────────────────────────
# Forcing, stratification, Coriolis and the inflow stay ours. Theirs has a
# surface freshwater flux driving a buoyant plume, N^2 = 2e-4 s^-2 as a
# prescribed linear background, f = 1.26e-4 (60 N) against our 8.39e-5
# (35.2 N), and v = -0.2 m/s inflow. Matching all of that would be
# reimplementing their model, and then a disagreement would be unattributable.
# Changing one thing at a time is the point.
#
# Between our f and theirs alone, Ld differs by 1.5x for the same g' and H.
# Expect the comparison to be qualitative.
#
# ── one difference worth knowing about ─────────────────────────────────────
# Our parameterisation puts a FLAT shelf between shelf_break_end and the
# offshore ramp. Zhao's profile slopes continuously from the coast to 200 m
# with no flat section. Here that flat section runs 50-100 km at -180 m. To
# remove it you would have to merge the two ramps, which the background
# function cannot express without a rewrite.
#
# ── cost ───────────────────────────────────────────────────────────────────
# Lz = 200 m at dz = 1 m is Nz = 200, so 300x400x200 = 24M cells, 4x the
# standard configuration: ~1.7 h for 120 days at 500 m, ~10 GB on the GPU.
# dt should be close to unchanged, since the vertical CFL is set by the
# MINIMUM dz and that is still 1 m -- but a 200 m basin admits larger w than
# a 50 m one, so the walltime below carries margin.
#
# Submit:  qsub src/sweep/submit_zhao_endmember.pbs.template     (array 1-1)
# Check:   julia tools/check_bathymetry.jl src/sweep/params_zhao_endmember.toml
# ═══════════════════════════════════════════════════════════════════════════

[[runs]]
run_label       = "zhao_shelf"
Zs              = -180.0      # = Zsh, so no shoal is built
Zsh             = -180.0
h_deep          = -200.0
shelf_break_end = 50000.0
rise_mid        = 100000.0
rise_width      = 5000.0
shoal_length    = 1000.0      # irrelevant once Zs = Zsh; explicit for clarity
Lz              = 200.0
dz              = 1.0
deep_strat_frac = 0.2
dx              = 500.0
sim_days        = 120.0
